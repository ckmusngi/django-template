{% extends 'base.html' %}

{% block title %}Dashboard — MyApp{% endblock %}

{% block content %}
<div class="mb-4">
    <h4 class="fw-bold mb-1">Welcome, {{ user.username }}.</h4>
    <p class="text-muted" style="font-size:14px;">Here's an overview of your account.</p>
</div>

<div class="row g-3 mb-4">
    <div class="col-sm-6 col-lg-3">
        <div class="card p-3">
            <div class="d-flex align-items-center gap-3">
                <div style="width:42px;height:42px;border-radius:10px;background:#eff6ff;display:flex;align-items:center;justify-content:center;">
                    <i class="bi bi-bar-chart-fill text-primary"></i>
                </div>
                <div>
                    <div class="fw-bold fs-5">0</div>
                    <div class="text-muted" style="font-size:13px;">Stat One</div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-lg-3">
        <div class="card p-3">
            <div class="d-flex align-items-center gap-3">
                <div style="width:42px;height:42px;border-radius:10px;background:#f0fdf4;display:flex;align-items:center;justify-content:center;">
                    <i class="bi bi-check-circle-fill text-success"></i>
                </div>
                <div>
                    <div class="fw-bold fs-5">0</div>
                    <div class="text-muted" style="font-size:13px;">Stat Two</div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-lg-3">
        <div class="card p-3">
            <div class="d-flex align-items-center gap-3">
                <div style="width:42px;height:42px;border-radius:10px;background:#fff7ed;display:flex;align-items:center;justify-content:center;">
                    <i class="bi bi-clock-fill text-warning"></i>
                </div>
                <div>
                    <div class="fw-bold fs-5">0</div>
                    <div class="text-muted" style="font-size:13px;">Stat Three</div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-lg-3">
        <div class="card p-3">
            <div class="d-flex align-items-center gap-3">
                <div style="width:42px;height:42px;border-radius:10px;background:#fdf4ff;display:flex;align-items:center;justify-content:center;">
                    <i class="bi bi-star-fill" style="color:#a855f7;"></i>
                </div>
                <div>
                    <div class="fw-bold fs-5">0</div>
                    <div class="text-muted" style="font-size:13px;">Stat Four</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header px-4 py-3">Recent Activity</div>
    <div class="card-body text-center py-5 text-muted" style="font-size:14px;">
        <i class="bi bi-inbox fs-1 d-block mb-2 text-secondary"></i>
        Nothing here yet.
    </div>
</div>
{% endblock %}
