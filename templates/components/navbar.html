<nav id="topbar">
    <span class="topbar-title">{% block page_title %}Dashboard{% endblock %}</span>

    <div class="topbar-actions">
        <button class="btn btn-sm btn-light border" style="border-radius:8px;">
            <i class="bi bi-bell"></i>
        </button>

        <div class="dropdown">
            <div class="avatar dropdown-toggle" data-bs-toggle="dropdown" style="list-style:none;">
                {{ user.username|first|upper }}
            </div>
            <ul class="dropdown-menu dropdown-menu-end" style="min-width:180px; border-radius:10px; font-size:14px;">
                <li><span class="dropdown-item-text text-muted" style="font-size:12px;">{{ user.username }}</span></li>
                <li><hr class="dropdown-divider my-1"></li>
                <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
                <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
                <li><hr class="dropdown-divider my-1"></li>
                <li>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="dropdown-item text-danger">
                            <i class="bi bi-box-arrow-right me-2"></i>Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
